appId: com.interview-copilot.app
productName: Interview Copilot
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: build/whisper/darwin-arm64/whisper-cli
    to: whisper/bin/whisper-cli
mac:
  category: public.app-category.productivity
  identity: null
  extendInfo:
    NSMicrophoneUsageDescription: Interview Copilot needs microphone access to record your side of an interview.
