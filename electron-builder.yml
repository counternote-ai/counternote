appId: app.counternote
productName: CounterNote
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: build/whisper/darwin-arm64/whisper-cli
    to: whisper/bin/whisper-cli
  - from: build/audio-capture/darwin-arm64/counternote-audio-capture
    to: audio-capture/bin/counternote-audio-capture
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.inherit.plist
  extendInfo:
    NSMicrophoneUsageDescription: CounterNote needs microphone access to record your side of a conversation.
    NSScreenCaptureUsageDescription: CounterNote needs screen capture access to record meeting audio.
  binaries:
    - audio-capture/bin/counternote-audio-capture
